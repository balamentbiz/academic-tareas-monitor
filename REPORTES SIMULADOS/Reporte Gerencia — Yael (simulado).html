<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Quicksand:wght@500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#212e67;--navy-deep:#10215c;--periwinkle:#87b1ea;--cyan:#09a3ef;
  --text:#10215c;--sub:rgba(16,33,92,.55);--text3:rgba(16,33,92,.38);
  --glass:rgba(255,255,255,.66);--glass-border:rgba(255,255,255,.75);
  --border:rgba(16,33,92,.10);
  --green:#1d9e4b;--orange:#cf7500;--red:#e0362c;--indigo:#4553c4;
  --font:'Quicksand',sans-serif;--display:'Bebas Neue',sans-serif;
}
body{
  width:900px;min-height:600px;
  font-family:var(--font);font-size:14px;color:var(--text);
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(700px 380px at 88% -6%, rgba(9,163,239,.18), transparent 60%),
    radial-gradient(620px 420px at -8% 26%, rgba(135,177,234,.38), transparent 60%),
    radial-gradient(560px 460px at 50% 108%, rgba(33,46,103,.15), transparent 55%),
    linear-gradient(165deg,#dbe6fa 0%,#eef2fb 38%,#f6f6f6 62%,#d9e3f8 100%);
}

/* ── Header ── */
.header{
  padding:30px 40px 24px;
  display:flex;align-items:center;gap:18px;
}
.header-logo{
  width:66px;height:66px;border-radius:18px;flex-shrink:0;
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 28px rgba(16,33,92,.18),0 2px 8px rgba(16,33,92,.10);
  overflow:hidden;
}
.header-logo img{width:54px;height:54px;object-fit:contain;display:block}
.header-info{flex:1}
.header-title{font-family:var(--display);font-size:34px;letter-spacing:4px;color:var(--navy-deep);line-height:1}
.header-title small{color:var(--periwinkle);font-size:20px;letter-spacing:6px}
.header-sub{font-size:11px;color:var(--sub);font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-top:5px}
.header-meta{text-align:right}
.header-name{font-family:var(--display);font-size:24px;letter-spacing:1.5px;color:var(--cyan)}
.header-date{font-size:11px;color:var(--text3);margin-top:4px;font-weight:700}
.header-rule{height:2px;margin:0 40px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--cyan),var(--navy),transparent)}

/* ── Body ── */
.body{padding:24px 40px 30px;display:flex;flex-direction:column;gap:20px}

/* Tarjeta glass base */
.glass{
  background:var(--glass);
  border:1px solid var(--glass-border);
  border-radius:16px;
  box-shadow:0 10px 26px rgba(16,33,92,.10),0 2px 6px rgba(16,33,92,.05);
}

/* ── Stats ── */
.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.stat-card{padding:14px 13px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3.5px}
.stat-card.blue::before{background:linear-gradient(90deg,var(--cyan),#2b6fe0)}
.stat-card.green::before{background:linear-gradient(90deg,#2ec46b,var(--green))}
.stat-card.orange::before{background:linear-gradient(90deg,#f5a623,var(--orange))}
.stat-card.red::before{background:linear-gradient(90deg,#ff6257,var(--red))}
.stat-card.indigo::before{background:linear-gradient(90deg,#7a88e8,var(--indigo))}
.stat-label{font-size:9px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.9px;margin-bottom:6px}
.stat-value{font-family:var(--display);font-size:22px;letter-spacing:1px;line-height:1;color:var(--navy-deep)}
.stat-card.blue .stat-value{color:#067ab8}
.stat-card.green .stat-value{color:var(--green)}
.stat-card.orange .stat-value{color:var(--orange)}
.stat-card.red .stat-value{color:var(--red)}
.stat-card.indigo .stat-value{color:var(--indigo)}
.stat-sub{font-size:9.5px;color:var(--text3);margin-top:4px;font-weight:700}
/* Anillo de productividad */
.ring-wrap{display:flex;align-items:center;gap:10px;margin-top:2px}
.ring{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ring span{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:14px;color:var(--indigo);letter-spacing:.5px}
.ring-lbl{font-size:9px;font-weight:800;color:var(--text3);line-height:1.5}
/* Barra de proporción en páginas Chrome */
.page-bar{height:4px;background:rgba(16,33,92,.08);border-radius:2px;margin-top:5px;overflow:hidden}
.page-bar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#31c1ff,#067ab8)}

/* ── Interacciones ── */
.interaction-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.int-chip{padding:11px 14px;display:flex;align-items:center;gap:11px;border-radius:999px}
.int-icon{width:30px;height:30px;border-radius:999px;flex-shrink:0;
  background:linear-gradient(135deg,var(--navy),var(--navy-deep));
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 4px 10px rgba(16,33,92,.28)}
.int-icon svg{width:15px;height:15px}
.int-val{font-family:var(--display);font-size:20px;color:var(--navy-deep);letter-spacing:.8px;line-height:1}
.int-lbl{font-size:9px;color:var(--text3);font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin-top:2px}

/* ── Secciones ── */
.section{display:flex;flex-direction:column;gap:8px}
.section-title{
  display:flex;align-items:center;gap:8px;
  font-family:var(--display);font-size:15px;letter-spacing:2.2px;
  color:var(--navy-deep);text-transform:uppercase;
  padding-bottom:7px;border-bottom:1.5px solid var(--border);
}
.section-title .st-ico{width:22px;height:22px;border-radius:7px;flex-shrink:0;
  background:linear-gradient(135deg,var(--cyan),#2b6fe0);
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 3px 8px rgba(9,163,239,.35)}
.section-title .st-ico svg{width:12px;height:12px}
.section-title span.cnt{font-size:11px;color:var(--text3);font-family:var(--font);letter-spacing:0;font-weight:800}

/* Actividades */
.activity-row{
  background:rgba(29,158,75,.08);border:1px solid rgba(29,158,75,.16);
  border-left:3.5px solid var(--green);
  border-radius:12px;padding:9px 13px;
  display:flex;align-items:center;gap:12px;
}
.activity-num{font-family:var(--display);font-size:18px;color:var(--green);width:24px;flex-shrink:0}
.activity-name{font-size:13px;font-weight:800;color:var(--navy-deep);flex:1}
.activity-time{font-size:11px;color:var(--sub);font-weight:700}
.activity-dur{font-family:var(--display);font-size:14px;color:#fff;
  background:linear-gradient(135deg,#2ec46b,var(--green));padding:3px 12px;border-radius:999px;
  box-shadow:0 3px 8px rgba(29,158,75,.3)}

/* Actividades extras asignadas */
.extra-row{
  background:rgba(9,163,239,.07);border:1px solid rgba(9,163,239,.16);
  border-left:3.5px solid var(--cyan);
  border-radius:12px;padding:9px 13px;
  display:flex;align-items:center;gap:12px;
}
.extra-estado{font-size:10px;font-weight:800;flex-shrink:0}

/* Tiempos muertos */
.idle-row{
  background:rgba(224,54,44,.06);border:1px solid rgba(224,54,44,.14);
  border-left:3.5px solid var(--red);
  border-radius:12px;padding:9px 13px;
  display:flex;align-items:center;gap:12px;
}
.idle-dur{font-family:var(--display);font-size:14px;color:#fff;
  background:linear-gradient(135deg,#ff6257,var(--red));padding:3px 12px;border-radius:999px;flex-shrink:0}
.idle-time{font-size:11px;color:var(--sub);font-weight:700}
.idle-reason{font-size:11.5px;color:var(--sub);flex:1;font-weight:600}

/* Páginas Chrome */
.page-row{padding:9px 13px;display:flex;align-items:center;gap:12px}
.page-num{font-family:var(--display);font-size:16px;color:var(--text3);width:20px;flex-shrink:0}
.page-info{flex:1;min-width:0}
.page-title{font-size:12px;font-weight:800;color:var(--navy-deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-url{font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;font-weight:600}
.page-dur{font-family:var(--display);font-size:14px;color:#067ab8;flex-shrink:0}

/* Apps / pausas */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.app-row{padding:9px 13px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.app-name{font-size:12px;font-weight:800;color:var(--navy)}
.app-dur{font-family:var(--display);font-size:13px;color:#067ab8}

/* Comentarios */
.comments-box{padding:14px 18px;font-size:13px;color:var(--navy);font-weight:600;line-height:1.6;font-style:italic}

/* ATC Checklist */
.atc-checklist-row{
  border-radius:12px;padding:9px 13px;display:flex;flex-direction:column;gap:5px;
  background:rgba(9,163,239,.06);border:1px solid rgba(9,163,239,.14);border-left:3.5px solid var(--cyan);
}
.atc-checklist-row.done{background:rgba(29,158,75,.07);border-color:rgba(29,158,75,.16);border-left-color:var(--green)}
.atc-checklist-row.pending{background:rgba(16,33,92,.03);border-color:rgba(16,33,92,.08);border-left-color:rgba(16,33,92,.18)}
.atc-act-name{font-size:13px;font-weight:800;color:var(--navy-deep)}
.atc-act-name.done{color:var(--green)}
.atc-act-name.pending{color:var(--text3)}
.atc-exec-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.atc-exec-chip{font-size:10px;font-weight:700;color:var(--navy);
  background:rgba(255,255,255,.85);border:1px solid var(--border);border-radius:999px;padding:2px 10px}

.atc-money-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

/* Footer */
.footer{
  margin:6px 40px 26px;padding:14px 22px;border-radius:16px;
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  box-shadow:0 12px 28px rgba(16,33,92,.28);
}
.footer-left{display:flex;align-items:center;gap:10px}
.footer-logo{width:26px;height:26px;border-radius:8px;background:#fff;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.footer-logo img{width:21px;height:21px;object-fit:contain}
.footer-brand{font-family:var(--display);font-size:15px;letter-spacing:2.5px;color:#fff}
.footer-brand small{color:var(--periwinkle);letter-spacing:4px;font-size:11px}
.footer-gen{font-size:10.5px;color:rgba(246,246,246,.55);font-weight:700}
</style>
</head>
<body id="report-root">
<!-- Contenido inyectado por JS -->
<script>
window.addEventListener("message", function(e) {
  if (e.data && e.data.type === "render-report") {
    renderReport(e.data.report);
  }
});

function t(ts) { return ts || "—"; }
function safe(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ── Iconos vectoriales de marca ───────────────────────────────────────────────
function ico(name, sw) {
  var p = {
    click:   '<circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>',
    keys:    '<rect x="3.5" y="7" width="17" height="11" rx="2.5"/><path d="M7 11h.01M11 11h.01M15 11h.01M7.5 14.5h9"/>',
    idle:    '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
    clip:    '<rect x="6" y="4.5" width="12" height="16" rx="2.5"/><path d="M9.5 4.5a2.5 2.5 0 0 1 5 0"/><path d="M9 12l2.2 2.2L15.5 10"/>',
    pause:   '<path d="M9.5 6.5v11M14.5 6.5v11"/>',
    zzz:     '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
    apps:    '<rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/>',
    globe:   '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.9 5.2 3.9 8.5s-1.3 6.1-3.9 8.5c-2.6-2.4-3.9-5.2-3.9-8.5S9.4 5.9 12 3.5z"/>',
    money:   '<circle cx="12" cy="12" r="8.5"/><path d="M12 7v10M14.6 9c-.6-.9-1.5-1.4-2.6-1.4-1.6 0-2.7.8-2.7 2 0 2.7 5.4 1.4 5.4 4 0 1.2-1.1 2-2.7 2-1.2 0-2.2-.5-2.8-1.5"/>',
    chat:    '<path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8a2.5 2.5 0 0 1-2.5 2.5H9l-5 4z"/>',
    folder:  '<path d="M3.5 7.5v11a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-6l-2-3h-5a2 2 0 0 0-2 2z"/>',
  }[name] || "";
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(sw||2)+'" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
}

function renderReport(r) {
  var s = r.summary || {};
  var activities  = r.activities  || [];
  var idlePeriods = r.idlePeriods || [];
  var chromePages = r.chromePages || [];
  var appsOpened  = r.appsOpened  || [];
  var pauses      = r.pauses      || [];

  var html = "";

  // ── Header ────────────────────────────────────────────────────────────────
  html += '<div class="header">';
  html += '<div class="header-logo"><img src="logo.png" alt="Academic Tareas"/></div>';
  html += '<div class="header-info">';
  html += '<div class="header-title">ACADEMIC <small>TAREAS</small></div>';
  html += '<div class="header-sub">Reporte de Productividad</div>';
  html += '</div>';
  html += '<div class="header-meta">';
  html += '<div class="header-name">' + safe(r.meta.collaborator) + '</div>';
  html += '<div class="header-date">' + safe(r.meta.date) + ' &nbsp;·&nbsp; Generado: ' + new Date(r.meta.generatedAt).toLocaleTimeString("es-MX") + '</div>';
  html += '</div></div>';
  html += '<div class="header-rule"></div>';

  // ── Body ──────────────────────────────────────────────────────────────────
  html += '<div class="body">';

  html += '<div class="stats-row">';
  html += statCard("blue",   "Entrada → Salida", t(s.startTime) + " – " + t(s.endTime), "Duración: " + t(s.totalDuration));
  html += statCard("green",  "Tiempo activo",    t(s.activeTime),  "");
  html += statCard("orange", "Tiempo inactivo",  t(s.idleTime),    "");
  // Productividad como anillo visual
  var pct = Math.max(0, Math.min(100, s.productivityPct || 0));
  html += '<div class="stat-card glass indigo">'
        + '<div class="stat-label">Productividad</div>'
        + '<div class="ring-wrap">'
        + '<div class="ring" style="background:conic-gradient(#4553c4 ' + (pct * 3.6) + 'deg, rgba(69,83,196,.14) 0)"><span>' + pct + '%</span></div>'
        + '<div class="ring-lbl">del tiempo<br>de trabajo<br>activo</div>'
        + '</div></div>';
  html += statCard("red",    "Tiempos muertos",  idlePeriods.length + " período" + (idlePeriods.length!==1?"s":""), "");
  html += '</div>';

  html += '<div class="interaction-row">';
  html += intChip("click", s.clicks||0,            "Clics");
  html += intChip("keys",  s.keyPresses||0,        "Teclas");
  html += intChip("idle",  s.totalIdlePeriods||0,  "T. Muertos");
  html += intChip("clip",  s.totalActivities||0,   "Actividades");
  html += '</div>';

  if (activities.length > 0) {
    html += '<div class="section">';
    html += sectionTitle("clip", "Actividades registradas", activities.length);
    activities.forEach(function(a) {
      html += '<div class="activity-row">';
      html += '<div class="activity-num">' + a.number + '</div>';
      html += '<div class="activity-name">' + safe(a.name) + '</div>';
      html += '<div class="activity-time">' + t(a.startTime) + ' → ' + t(a.endTime) + '</div>';
      html += '<div class="activity-dur">' + t(a.duration) + '</div>';
      html += '</div>';
    });
    html += '</div>';
  }

  // Actividades extras asignadas (panel Actividades/Asignadas)
  var extras = r.actividadesExtras || [];
  if (extras.length > 0) {
    html += '<div class="section">';
    html += sectionTitle("folder", "Actividades asignadas (extras)", extras.length);
    extras.forEach(function(a, i) {
      var est = a.estado === "terminada" ? "✓ Terminada"
              : a.estado === "en_proceso" ? "▶ En proceso"
              : a.estado === "pausada" ? "⏸ Pausada" : "⏳ Pendiente";
      var estColor = a.estado === "terminada" ? "var(--green)" : a.estado === "pausada" ? "var(--gold, #a97a00)" : "var(--orange)";
      html += '<div class="extra-row">';
      html += '<div class="activity-num" style="color:#067ab8">' + (i + 1) + '</div>';
      html += '<div style="flex:1;min-width:0">';
      html += '<div class="activity-name">' + safe(a.titulo) + ' <span style="font-size:10px;font-weight:800;color:#067ab8">[' + safe(a.prioridad) + ']</span></div>';
      html += '<div style="font-size:10.5px;color:var(--text3);font-weight:700">'
            + (a.asignada_por ? 'Asignada por ' + safe(a.asignada_por) + ' · ' : '')
            + a.iniciado + ' → ' + a.terminado
            + (a.pausas ? ' · ' + a.pausas + ' pausa' + (a.pausas !== 1 ? 's' : '') : '')
            + '</div>';
      html += '</div>';
      html += '<div class="extra-estado" style="color:' + estColor + '">' + est + '</div>';
      html += '<div class="activity-dur" style="background:linear-gradient(135deg,#31c1ff,#09a3ef)">' + formatMs(a.trabajo_ms) + '</div>';
      html += '</div>';
    });
    html += '</div>';
  }

  if (pauses.length > 0) {
    html += '<div class="section">';
    html += sectionTitle("pause", "Pausas", pauses.length);
    html += '<div class="two-col">';
    pauses.forEach(function(p) {
      html += '<div class="app-row glass"><span class="app-name">' + safe(p.reason) + '</span>';
      html += '<span class="app-dur">' + t(p.start) + '→' + t(p.end) + '</span></div>';
    });
    html += '</div></div>';
  }

  if (idlePeriods.length > 0) {
    html += '<div class="section">';
    html += sectionTitle("zzz", "Tiempos muertos", idlePeriods.length);
    idlePeriods.forEach(function(ip) {
      html += '<div class="idle-row">';
      html += '<div class="idle-dur">' + t(ip.duration) + '</div>';
      html += '<div class="idle-time">' + t(ip.start) + ' → ' + t(ip.end) + '</div>';
      html += '<div class="idle-reason">Motivo: ' + safe(ip.reason) + '</div>';
      html += '</div>';
    });
    html += '</div>';
  }

  if (appsOpened.length > 0) {
    html += '<div class="section">';
    html += sectionTitle("apps", "Aplicaciones usadas", appsOpened.length);
    html += '<div class="two-col">';
    appsOpened.slice(0, 16).forEach(function(a) {
      html += '<div class="app-row glass"><span class="app-name">' + safe(a.name) + '</span>';
      html += '<span class="app-dur">' + t(a.duration) + '</span></div>';
    });
    html += '</div></div>';
  }

  if (chromePages.length > 0) {
    html += '<div class="section">';
    html += sectionTitle("globe", "Páginas visitadas en Chrome", chromePages.length);
    var maxMs = Math.max.apply(null, chromePages.map(function(p) { return p.totalMs || 0; }).concat([1]));
    chromePages.slice(0, 12).forEach(function(p, i) {
      var w = Math.max(3, Math.round(((p.totalMs || 0) / maxMs) * 100));
      html += '<div class="page-row glass">';
      html += '<div class="page-num">' + (i+1) + '</div>';
      html += '<div class="page-info"><div class="page-title">' + safe(p.title) + '</div>';
      html += '<div class="page-url">' + safe(p.url) + '</div>';
      html += '<div class="page-bar"><i style="width:' + w + '%"></i></div></div>';
      html += '<div class="page-dur">' + t(p.duration) + '</div>';
      html += '</div>';
    });
    html += '</div>';
  }

  if (r.atcDinero) {
    var ad = r.atcDinero;
    html += '<div class="section">';
    html += sectionTitle("money", "Dinero del día", null);
    html += '<div class="atc-money-row">';
    html += statCard("green",  "Cobrado hoy",        "$" + (ad.dineroCobrado||0).toLocaleString("es-MX"), "Pagos recibidos en pedidos de hoy");
    html += statCard("orange", "Por cobrar",          "$" + (ad.porCobrar||0).toLocaleString("es-MX"),    "Pedidos completados sin pago total");
    html += statCard("blue",   "Pedidos creados",     ad.pedidosHoy,                                       "Pedidos registrados hoy");
    html += statCard("indigo", "Pedidos completados", ad.pedidosCompletadosHoy,                            "Finalizados hoy");
    html += '</div></div>';
  }

  if (r.atcActividades) {
    var aa = r.atcActividades;
    html += '<div class="section">';
    html += sectionTitle("clip", "Checklist ATC", aa.actUnicas + "/9 únicas · " + aa.totalExecs + " ejecuciones");
    aa.detalle.forEach(function(act) {
      var exs = act.ejecuciones || [];
      var done = exs.length > 0;
      var cls  = done ? "done" : "pending";
      html += '<div class="atc-checklist-row ' + cls + '">';
      html += '<div class="atc-act-name ' + cls + '">' + (done ? "✓ " : "☐ ") + safe(act.label) + '</div>';
      if (done) {
        html += '<div class="atc-exec-list">';
        exs.forEach(function(e, i) {
          var dur = e.duracion_ms ? formatMs(e.duracion_ms) : "—";
          html += '<div class="atc-exec-chip">#' + (i+1) + ' ' + safe(e.iniciada||"") + ' → ' + safe(e.terminada||"") + ' (' + dur + ')</div>';
        });
        html += '</div>';
      }
      if (act.enCurso) {
        html += '<div style="font-size:10px;color:var(--orange);margin-top:2px;font-weight:800">⏱ En curso desde ' + safe(act.enCurso.iniciada||"") + '</div>';
      }
      html += '</div>';
    });
    html += '</div>';
  }

  if (r.comments) {
    html += '<div class="section">';
    html += sectionTitle("chat", "Comentarios", null);
    html += '<div class="comments-box glass">' + safe(r.comments) + '</div>';
    html += '</div>';
  }

  html += '</div>'; // /body

  // Footer
  html += '<div class="footer">';
  html += '<div class="footer-left">';
  html += '<div class="footer-logo"><img src="logo.png" alt=""/></div>';
  html += '<div class="footer-brand">ACADEMIC <small>TAREAS</small></div>';
  html += '</div>';
  html += '<div class="footer-gen">Generado el ' + safe(r.meta.date) + ' · ' + new Date(r.meta.generatedAt).toLocaleTimeString("es-MX") + '</div>';
  html += '</div>';

  document.body.innerHTML = html;
  document.title = "report-ready";
}

function formatMs(ms) {
  if (!ms) return "0s";
  var s = Math.floor(ms / 1000);
  var m = Math.floor(s / 60); s = s % 60;
  var h = Math.floor(m / 60); m = m % 60;
  if (h > 0) return h + "h " + m + "m";
  if (m > 0) return m + "m " + s + "s";
  return s + "s";
}
function sectionTitle(icon, label, cnt) {
  return '<div class="section-title">'
    + '<span class="st-ico">' + ico(icon) + '</span>'
    + label
    + (cnt != null ? ' <span class="cnt">(' + cnt + ')</span>' : '')
    + '</div>';
}
function statCard(cls, label, value, sub) {
  return '<div class="stat-card glass ' + cls + '">'
    + '<div class="stat-label">' + label + '</div>'
    + '<div class="stat-value">' + safe(value) + '</div>'
    + (sub ? '<div class="stat-sub">' + safe(sub) + '</div>' : '')
    + '</div>';
}
function intChip(icon, val, label) {
  return '<div class="int-chip glass">'
    + '<div class="int-icon">' + ico(icon) + '</div>'
    + '<div><div class="int-val">' + val + '</div>'
    + '<div class="int-lbl">' + label + '</div></div>'
    + '</div>';
}
